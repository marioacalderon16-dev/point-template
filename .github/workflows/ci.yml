name: CI

on:
  push:
  pull_request:

# Solo lectura del repo: el token del job no puede escribir aunque una dependencia se vea comprometida
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    # Base desechable por ejecución: los tests nunca tocan la base de desarrollo ni la de producción.
    # Proyecto con MySQL: sustituye el servicio por el bloque comentado de abajo y el env por
    # DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=app_test;charset=utf8mb4 (DB_USER/DB_PASS: app)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # mysql:
      #   image: mysql:8.4
      #   env:
      #     MYSQL_DATABASE: app_test
      #     MYSQL_USER: app
      #     MYSQL_PASSWORD: app
      #     MYSQL_ROOT_PASSWORD: root
      #   ports: ['3306:3306']
      #   options: >-
      #     --health-cmd "mysqladmin ping -h 127.0.0.1"
      #     --health-interval 5s
      #     --health-timeout 5s
      #     --health-retries 10

    # Las variables del proceso tienen prioridad sobre .env (que en CI no existe)
    env:
      DB_DSN: pgsql:host=127.0.0.1;port=5432;dbname=app_test
      DB_USER: app
      DB_PASS: app

    steps:
      # Acciones fijadas por SHA (una etiqueta se puede mover); el comentario indica la versión
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, pcntl

      - run: composer install --no-interaction --prefer-dist

      - run: composer audit --no-interaction

      - run: composer stan

      - run: php point migrate

      - run: php point test
